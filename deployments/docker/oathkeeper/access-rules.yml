# MCP for agents: Streamable HTTP, so GET/DELETE as well as POST. Keto checks run per tool call.
- id: planning-site-mcp
  upstream:
    url: http://site-service:50090
  match:
    url: "http://<.*>/planning/mcp"
    methods: ["GET", "POST", "DELETE"]
  authenticators:
    - handler: bearer_token
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: header

- id: planning-conversation-service
  upstream:
