  mutators:
    - handler: header

# Assistant replies stream over SSE: POST .../messages starts a turn, GET .../stream re-attaches.
- id: planning-conversation-chat
  upstream:
    url: http://planning-conversation:50100
  match:
    url: "http://<.*>/planning/chat/conversations/<[0-9a-f-]+>/<messages|stream>"
    methods: ["GET", "POST"]
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: header
