- id: userchargers-project-service
  upstream:
    url: http://backend:50051
  match:
    url: "http://<.*>/userchargers.v1.ProjectService/<CreateProject|UpdateProject|DeleteProject|ListProjects|GetProject|ManageProjectChargers>"
    methods: ["POST"]
  # No anonymous fallback - a session is required. The paid-plan gate on projects is *not*
  # here either: no authorizer can see a Lago plan, so internal/entitlement checks it in
  # the Go handler and returns PermissionDenied.
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: header

- id: userchargers-rating-service
  upstream:
    url: http://backend:50051
  match:
    # The rating write path moved here from registry-service-submit-variant-rating above,
    # which stays as a deprecated shim for clients generated before the move.
    url: "http://<.*>/userchargers.v1.RatingService/<SubmitRating|ListMyRatings>"
    methods: ["POST"]
  # No anonymous fallback - a session is required.
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: header

- id: userchargers-pending-action-service
  upstream:
    url: http://backend:50051
  match:
    # Deciding on actions the chat assistant proposed, from the chat UI with the user's own
    # session. The assistant's model never sees a confirm or reject tool - its MCP tools
    # can only propose - so a decision always starts from a user click routed through here.
    url: "http://<.*>/userchargers.v1.PendingActionService/<GetPendingAction|ListPendingActions|ConfirmPendingAction|RejectPendingAction>"
    methods: ["POST"]
  # No anonymous fallback - a session is required.
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: header

