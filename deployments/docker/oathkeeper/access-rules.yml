# Per-RPC access rules. When called via Traefik's forwardAuth middleware (not
# Oathkeeper's own reverse-proxy mode - the "upstream" field below is unused in this
# setup), Oathkeeper reconstructs the request URL it matches against from the
# X-Forwarded-Host/-Uri headers Traefik sends: the *public-facing* host
# (e.g. localhost:8000), plus the path *after* the router's strip-prefix middleware has
# already run (confirmed empirically) - e.g. "/registry.v1.RegistryService/SearchChargers",
# not the internal backend:50051 address. The host is wildcarded below since it varies
# by how the stack is reached (localhost, a LAN IP, a different port).

- id: oecs-schema
  upstream:
    url: http://backend:50051
  match:
    # Plain REST paths (see cmd/app/main.go's HTTP dispatch, §4 of the auth plan), not
    # gRPC - these never matched either of the two gRPC-shaped rules below, so every
    # request 404'd with "no matching rule" before reaching the backend at all (caught by
    # the Submit Charger page failing to load the schema for Monaco's diagnostics).
    url: "http://<.*>/oecs-schema/<.*>"
    methods: ["GET"]
  # Static schema files - no session needed, same as most RegistryService RPCs.
  authenticators:
    - handler: anonymous
  authorizer:
    handler: allow
  mutators:
    - handler: noop

- id: registry-service-default
  upstream:
    url: http://backend:50051
  match:
    # Oathkeeper requires exactly one matching rule per request (no first-match/priority
    # semantics like Traefik, and RE2 - which its glob matcher embeds - has no negative
    # lookahead to write "anything except SubmitChargerSpec") - so the public RPCs are
    # enumerated explicitly here rather than wildcarded, which also means a newly added
    # RPC defaults to *no* matching rule (an error, not silently public) until someone
    # decides which bucket it belongs in.
    url: "http://<.*>/registry.v1.RegistryService/<SearchChargers|GetManufacturers|GetCharger|GetManufacturer>"
    methods: ["POST"]
  # Public by default - session forwarded as identity headers when present, anonymous
  # otherwise. These RPCs don't require a session at all.
  authenticators:
    - handler: cookie_session
    - handler: anonymous
  authorizer:
    handler: allow
  mutators:
    - handler: header

- id: registry-service-submit-charger-spec
  upstream:
    url: http://backend:50051
  match:
    url: "http://<.*>/registry.v1.RegistryService/SubmitChargerSpec"
    methods: ["POST"]
  # No anonymous fallback - a session is required. Manufacturer-only, but that isn't
  # checked here: any session reaches this rule (schema_id/X-User-Type isn't consulted by
  # any authorizer below), and the Go handler rejects non-manufacturer accounts instead.
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: header

- id: registry-service-delete-account
  upstream:
    url: http://backend:50051
  match:
    url: "http://<.*>/registry.v1.RegistryService/DeleteAccount"
    methods: ["POST"]
  # No anonymous fallback - a session is required.
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: header

- id: registry-service-submit-variant-rating
  upstream:
    url: http://backend:50051
  match:
    url: "http://<.*>/registry.v1.RegistryService/SubmitVariantRating"
    methods: ["POST"]
  # No anonymous fallback - a session is required. Same known gap as
  # registry-service-submit-charger-spec above: individual/business eligibility isn't
  # checked here (schema_id/X-User-Type isn't consulted by any authorizer below) - it's
  # enforced in the Go handler instead.
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: header

- id: manufacturer-service
  upstream:
    url: http://backend:50051
  match:
    # manufacturer.v1.ManufacturerService is registered on the same public gRPC server
    # as RegistryService (see cmd/app/main.go), not the isolated AdminAPI - manufacturers
    # authenticate as ordinary browser users, same as registry-service-submit-charger-spec
    # above. Every RPC is self-service and manufacturer-only - enumerated explicitly, same
    # reasoning as registry-service-default's comment above.
    url: "http://<.*>/manufacturer.v1.ManufacturerService/<GetManufacturerChargers|CancelSubmission|EditSpecification>"
    methods: ["POST"]
  # No anonymous fallback - a session is required. Account-type
  # eligibility isn't checked here either (same as above) - it's enforced in the Go
  # handler instead.
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: header

- id: prompts-service
  upstream:
    url: http://backend:50051
  match:
    # prompts.v1.PromptSuggestionsService is registered on the same public gRPC server as
    # RegistryService (see cmd/app/main.go). Public, like registry-service-default above -
    # there's nothing caller-specific about suggested prompts.
    url: "http://<.*>/prompts.v1.PromptSuggestionsService/<ListPromptSuggestions>"
    methods: ["POST"]
  authenticators:
    - handler: cookie_session
    - handler: anonymous
  authorizer:
    handler: allow
  mutators:
    - handler: header

- id: support-chat-service
  upstream:
    url: http://host.docker.internal:50060
  match:
    url: "http://<.*>/supportchat.v1.SupportChatService/<GetIdentity>"
    methods: ["POST"]
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: header

- id: conversation-service
  upstream:
    url: http://host.docker.internal:50051
  match:
    # gRPC-Method-shaped, like registry-service-default above - conversation.v1
    # .ConversationService is called directly (gRPC-Web) now, no oecs-registry
    # backend involved (see web/src/lib/chat/client.ts and Traefik's own
    # "conversation" router/service). grpc-web requests are always POST. Every
    # method is wildcarded here (unlike registry-service-default's explicit list):
    # conversations are inherently per-user, so there's no public subset to carve
    # out - ConversationService itself enforces ownership using the identity these
    # headers carry (ignoring whatever user_id a request claims), not this rule.
    url: "http://<.*>/conversation.v1.ConversationService/<.*>"
    methods: ["POST"]
  # No anonymous fallback - a session is required (see
  # registry-service-submit-charger-spec's identical reasoning above).
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: header

- id: conversation-service-stream
  upstream:
    url: http://host.docker.internal:50051
  match:
    # StreamHandler - plain HTTP, not a gRPC method, hence its own rule.
    url: "http://<.*>/stream/conversations/<.*>"
    methods: ["GET"]
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: header

- id: billing-service-public
  upstream:
    url: http://host.docker.internal:50060
  match:
    # GetPlans only - called from the still-unauthenticated registration wizard.
    url: "http://<.*>/billing.v1.BillingService/<GetPlans>"
    methods: ["POST"]
  authenticators:
    - handler: anonymous
  authorizer:
    handler: allow
  mutators:
    - handler: noop

- id: billing-service
  upstream:
    # Informational only (see this file's header comment); real routing lives in Traefik.
    url: http://host.docker.internal:50060
  match:
    # Every other RPC is self-service - enumerated explicitly so a newly added RPC has
    # no matching rule until someone decides which bucket it belongs in.
    url: "http://<.*>/billing.v1.BillingService/<GetUsage|ListInvoices|GetPaymentPortalUrl|ChangePlan|GetEntitlements|SubscribeAddon|CancelAddon>"
    methods: ["POST"]
  # No anonymous fallback - a session is required.
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: header

- id: admin-api-service
  upstream:
    url: http://admin-api:50070
  match:
    # gRPC-Method-shaped, like registry-service-default above - matches AFTER Traefik's
    # strip-admin-api middleware already ran (see this file's header comment), so no
    # "/admin-api" prefix here.
    url: "http://<.*>/adminapi.v1.AdminApiService/<GetDashboardStats|SearchChargers|UpdateChargerStatus|UpdateChargerSpec|ListManufacturers|CreateManufacturer|ReassignChargerManufacturer|SetManufacturerOwner|GetFeedbackStats|ListFeedback|UploadKnowledgeDocument|ListKnowledgeDocuments|GetKnowledgeDocument|UpdateKnowledgeDocument|DeleteKnowledgeDocument>"
    methods: ["POST"]
  # Browser SPA session, unlike admin-service below (CLI/tooling bearer token) - admin-web
  # is a logged-in browser app, not grpcurl/a Go client. Same Keto admin-relation
  # authorizer as admin-service though - both gate on "is this identity an admin".
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: remote_json
    config:
      payload: |
        {
          "namespace": "Role",
          "object": "admin",
          "relation": "members",
          "subject_id": "{{ print .Subject }}"
        }
  mutators:
    - handler: header

- id: admin-service
  upstream:
    url: http://backend:50052
  match:
    url: "http://<.*>/admin.v1.AdminService/<SearchSchemas|UpdateSchemaStatus|UpdateSchemaSpec|CreateManufacturer|ListManufacturers|ReassignSchemaManufacturer|SetManufacturerOwner|ReindexChargers|ReindexManufacturers>"
    methods: ["POST"]
  # Operators/tooling, not a browser - bearer token from Kratos's API-flow login, not a
  # cookie. Authorization is a Keto admin-relation check, not "allow" - see
  # oathkeeper.yml's remote_json authorizer and its verify-at-implementation-time note.
  authenticators:
    - handler: bearer_token
  authorizer:
    handler: remote_json
    config:
      payload: |
        {
          "namespace": "Role",
          "object": "admin",
          "relation": "members",
          "subject_id": "{{ print .Subject }}"
        }
  mutators:
    - handler: header

- id: userchargers-favorite-service
  upstream:
    url: http://backend:50051
  match:
    # userchargers.v1's three services are registered on the same public gRPC server as
    # RegistryService (see cmd/app/main.go). Every RPC is self-service and
    # individual- and business-only - enumerated explicitly, same reasoning as registry-service-default
    # above.
    url: "http://<.*>/userchargers.v1.FavoriteService/<FavoriteCharger|ListFavorites>"
    methods: ["POST"]
  # No anonymous fallback - a session is required. Individual/business eligibility isn't
  # checked here (same as registry-service-submit-variant-rating) - it's enforced in the
  # Go handler instead.
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: header

- id: preferences-service
  upstream:
    url: http://backend:50051
  match:
    # Every account type, self-service - no anonymous fallback.
    url: "http://<.*>/preferences.v1.PreferencesService/<GetPreferences|UpdatePreferences>"
    methods: ["POST"]
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
