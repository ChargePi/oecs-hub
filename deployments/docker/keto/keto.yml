# Dev config for the self-hosted Keto instance backing the AdminService admin-role check
# (see deployments/docker/oathkeeper/access-rules.yml's admin-service rule and the plan
# doc's §1.8). Keto is only ever called by Oathkeeper (read API) and the admin-bootstrap
# runbook step (write API) - neither port is routed through Traefik.

dsn: postgres://keto:keto@postgres:5432/keto?sslmode=disable&max_conns=20&max_idle_conns=4

namespaces:
  location: file:///etc/config/keto/namespaces.keto.ts

serve:
  read:
    host: 0.0.0.0
    port: 4466
  write:
    host: 0.0.0.0
    port: 4467

log:
  level: info
  format: json
