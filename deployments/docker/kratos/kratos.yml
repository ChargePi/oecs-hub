# Dev config for the self-hosted Kratos instance backing OECS Hub auth. Mounted into the
# kratos/kratos-migrate services in docker-compose.dev.yaml. See the plan doc's §1.3-1.4
# for the reasoning behind each non-obvious setting below.

dsn: postgres://kratos:kratos@kratos-postgres:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4

serve:
  public:
    # Everything is same-origin through Traefik (see docker-compose.dev.yaml labels), so
    # CORS stays disabled entirely - no cross-origin browser requests to Kratos happen.
    base_url: http://localhost:8000/ory/
    cors:
      enabled: false
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://localhost:8000/
  allowed_return_urls:
    - http://localhost:8000/

  methods:
    password:
      enabled: true
    totp:
      enabled: true
      config:
        issuer: OECS Hub
    webauthn:
      enabled: true
      config:
        passwordless: false
        rp:
          id: localhost
          display_name: OECS Hub
          origins:
            - http://localhost:8000
    link:
      enabled: true
    code:
      enabled: true
    oidc:
      enabled: true
      config:
        providers:
          - id: google
            provider: google
            client_id: ${OECS_HUB_KRATOS_GOOGLE_CLIENT_ID}
            client_secret: ${OECS_HUB_KRATOS_GOOGLE_CLIENT_SECRET}
            mapper_url: file:///etc/config/kratos/oidc.google.jsonnet
            scope:
              - email
              - profile

  flows:
    registration:
      enabled: true
      ui_url: http://localhost:8000/auth/register
      after:
        password:
          hooks:
            - hook: session
        oidc:
          hooks:
            - hook: session
    login:
      ui_url: http://localhost:8000/auth/login
    recovery:
      enabled: true
      ui_url: http://localhost:8000/auth/recovery
      use: code
    verification:
      enabled: true
      ui_url: http://localhost:8000/auth/verification
      use: code
      after:
        default_browser_return_url: http://localhost:8000/
    settings:
      ui_url: http://localhost:8000/settings
      # Kratos's own default already requires AAL2 to change credentials (password,
      # totp, webauthn) even when this is aal1 - that's native behavior, not something
      # this config needs to fight. This only controls reaching the settings page itself.
      required_aal: aal1
    logout:
      after:
        default_browser_return_url: http://localhost:8000/

session:
  cookie:
    # Kratos derives the cookie Path from serve.public.base_url (.../ory/ above) by
    # default - without this override the session cookie would never be sent on /api/*
    # gRPC-Web calls. Must stay "/" .
    path: "/"
    same_site: Lax
  whoami:
    # MFA is opt-in hardening via the Security page in v1, not required to reach
    # aal1-gated flows like submitting a charger spec.
    required_aal: aal1

courier:
  smtp:
    connection_uri: smtp://mailslurper:1025/?skip_ssl_verify=true

log:
  level: info
  format: json

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json
