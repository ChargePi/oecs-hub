# Explicit project name: this file lives in deployments/docker/, a directory name
# shared with other repos (e.g. chargeflow-registry) that also keep a compose file
# there. Without this, Compose derives the project name from the directory basename
# ("docker") and containers/volumes collide across repos.
name: oecs-hub
services:

  postgres:
    image: postgres:16
    container_name: oecs-hub-postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=oecs
      - POSTGRES_PASSWORD=oecs
      - POSTGRES_DB=oecs_hub
    ports:
      - "5434:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7
    container_name: oecs-hub-redis
    hostname: redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis:/data

  memgraph:
    image: memgraph/memgraph:latest
    container_name: oecs-hub-memgraph
    hostname: memgraph
    restart: unless-stopped
    ports:
      - "7687:7687"
      - "7444:7444"
    volumes:
      - memgraph:/var/lib/memgraph

  traefik:
    image: traefik:v3.3
    container_name: oecs-hub-traefik
    hostname: traefik
    restart: unless-stopped
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --api.insecure=true
    ports:
      - "8000:80"
      - "8091:8080"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro

  kratos-migrate:
    image: oryd/kratos:v25.4.0
    container_name: oecs-hub-kratos-migrate
    command: migrate sql -e --yes
    environment:
      - DSN=postgres://kratos:kratos@postgres:5432/kratos?sslmode=disable
    volumes:
      - ./kratos:/etc/config/kratos:ro
    depends_on:
      - postgres

  kratos:
    image: oryd/kratos:v25.4.0
    container_name: oecs-hub-kratos
    hostname: kratos
    restart: unless-stopped
    command: serve --dev --config /etc/config/kratos/kratos.yml
    environment:
      - OECS_HUB_KRATOS_GOOGLE_CLIENT_ID=${OECS_HUB_KRATOS_GOOGLE_CLIENT_ID:-}
      - OECS_HUB_KRATOS_GOOGLE_CLIENT_SECRET=${OECS_HUB_KRATOS_GOOGLE_CLIENT_SECRET:-}
    volumes:
      - ./kratos:/etc/config/kratos:ro
    ports:
      - "4433:4433"
    depends_on:
      - kratos-migrate

  mailslurper:
    image: oryd/mailslurper:latest-smtps
    container_name: oecs-hub-mailslurper
    hostname: mailslurper
    restart: unless-stopped
    ports:
      - "4437:4436"

  keto-migrate:
    image: oryd/keto:v0.14.0
    container_name: oecs-hub-keto-migrate
    command: migrate up -y --config /etc/config/keto/keto.yml
    volumes:
      - ./keto:/etc/config/keto:ro
    depends_on:
      - postgres

  keto:
    image: oryd/keto:v0.14.0
    container_name: oecs-hub-keto
    hostname: keto
    restart: unless-stopped
    command: serve --config /etc/config/keto/keto.yml
    volumes:
      - ./keto:/etc/config/keto:ro
    depends_on:
      - keto-migrate

  oathkeeper:
    image: oryd/oathkeeper:v0.40.7
    container_name: oecs-hub-oathkeeper
    hostname: oathkeeper
    restart: unless-stopped
    command: serve --config /etc/config/oathkeeper/oathkeeper.yml
    environment:
      - OECS_HUB_GATEWAY_SECRET=${OECS_HUB_GATEWAY_SECRET:-changeme-dev-only}
    volumes:
      - ./oathkeeper:/etc/config/oathkeeper:ro
    depends_on:
      - kratos
      - keto

  backend:
    build:
      context: ../..
      dockerfile: build/service/Dockerfile
    container_name: oecs-hub-backend
    hostname: backend
    restart: unless-stopped
    environment:
      - OECS_HUB_DATABASE_DSN=postgres://oecs:oecs@postgres:5432/oecs_hub?sslmode=disable
      - OECS_HUB_REDIS_ADDRESS=redis:6379
      - OECS_HUB_MEMGRAPH_ADDRESS=bolt://memgraph:7687
      - OECS_HUB_GRPC_ADDRESS=0.0.0.0:50051
      - OECS_HUB_ADMIN_GRPC_ADDRESS=0.0.0.0:50052
      - OECS_HUB_AUTH_GATEWAY_SECRET=${OECS_HUB_GATEWAY_SECRET:-changeme-dev-only}
      - OECS_HUB_KRATOS_ADMIN_URL=http://kratos:4434
    depends_on:
      - postgres
      - redis
      - memgraph
      - kratos

  web:
    build:
      context: ../../web
      args:
        VITE_FEATURE_CHAT: "true"
        VITE_FEATURE_BILLING: "true"
    container_name: oecs-hub-web
    hostname: web
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:50051
      - KRATOS_URL=http://kratos:4433
    volumes:
      - ../../web/public/chat-prompts:/usr/share/nginx/html/chat-prompts:ro
    depends_on:
      - backend
      - kratos

volumes:
  postgres:
  redis:
  memgraph:
