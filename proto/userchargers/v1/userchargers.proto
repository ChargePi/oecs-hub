syntax = "proto3";

package userchargers.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "registry/v1/registry.proto";

// userchargers.v1 owns the three user-scoped views of the charger catalogue that back the
// "My chargers" page for individual accounts: favorites, projects, and the chargers the
// caller has rated. Like manufacturer.v1, every RPC here is self-service - the caller and
// the scope of "their" data come from the authenticated identity forwarded by the
// Traefik/Oathkeeper edge, never from a client-supplied id.
//
// The aggregate per-category scores shown on a charger (registry.v1.CategoryRating) stay
// on the registry read path; RatingService owns only the write and the caller's own
// scores.

enum FavoriteState {
  FAVORITE_STATE_UNSPECIFIED = 0;
  FAVORITE_STATE_FAVORITED = 1;
  FAVORITE_STATE_UNFAVORITED = 2;
}

enum ProjectChargerAction {
  PROJECT_CHARGER_ACTION_UNSPECIFIED = 0;
  PROJECT_CHARGER_ACTION_ADD = 1;
  PROJECT_CHARGER_ACTION_REMOVE = 2;
  PROJECT_CHARGER_ACTION_SET_NOTE = 3;
}

message FavoriteChargerRequest {
  string charger_variant_id = 1;
  FavoriteState state = 2;
}

message FavoriteChargerResponse {
  string charger_variant_id = 1;
  // The resulting state, so a client that sent an already-applied state (the call is
  // idempotent) still learns where it ended up.
  bool favorited = 2;
}

message ListFavoritesRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message Favorite {
  registry.v1.ChargerVariantSummary summary = 1;
  google.protobuf.Timestamp favorited_at = 2;
}

message ListFavoritesResponse {
  repeated Favorite favorites = 1;
  int64 total_size = 2;
  string next_page_token = 3;
}

// Project is a user's named shortlist of chargers. The charger list is stored as an
// ordered embedded document (see deployments/migrations/007_add_user_chargers.sql), so
// order is meaningful and is the order of ProjectCharger below.
message Project {
  string id = 1;
  string name = 2;
  optional string description = 3;
  int64 charger_count = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message ProjectCharger {
  registry.v1.ChargerVariantSummary summary = 1;
  optional string note = 2;
}

message CreateProjectRequest {
  string name = 1;
  optional string description = 2;
}

message CreateProjectResponse {
  Project project = 1;
}

// UpdateProjectRequest carries project attributes only - membership changes go through
// ManageProjectChargers. Unset fields are left as they are.
message UpdateProjectRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
}

message UpdateProjectResponse {
  Project project = 1;
}

message DeleteProjectRequest {
  string id = 1;
}

message ListProjectsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListProjectsResponse {
  repeated Project projects = 1;
  int64 total_size = 2;
  string next_page_token = 3;
}

message GetProjectRequest {
  string id = 1;
}

message GetProjectResponse {
  Project project = 1;
  repeated ProjectCharger chargers = 2;
}

message ProjectChargerChange {
  string charger_variant_id = 1;
  ProjectChargerAction action = 2;
  // Set on ADD and SET_NOTE; ignored on REMOVE. An ADD with no note adds the charger
  // without one, an explicit empty string on SET_NOTE clears it.
  optional string note = 3;
}

message ManageProjectChargersRequest {
  string project_id = 1;
  repeated ProjectChargerChange changes = 2;
  // Optional full ordering, applied after changes - lets drag-to-reorder (and a reorder
  // combined with an add or remove) happen in one round trip. Must, once the changes have
  // been applied, be a permutation of the project's charger ids.
  repeated string ordered_charger_variant_ids = 3;
}

message ManageProjectChargersResponse {
  Project project = 1;
  repeated ProjectCharger chargers = 2;
}

message RatingInput {
  string category_name = 1;
  int32 score = 2; // 1-5 inclusive.
}

message SubmitRatingRequest {
  string charger_variant_id = 1;
  repeated RatingInput ratings = 2;
}

message SubmitRatingResponse {
  string charger_variant_id = 1;
  // The recomputed aggregate across all raters, not just the caller's scores.
  repeated registry.v1.CategoryRating ratings = 2;
}

message ListMyRatingsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message MyRating {
  registry.v1.ChargerVariantSummary summary = 1;
  // The caller's own per-category scores.
  repeated RatingInput my_scores = 2;
  // The aggregate across all raters, the same values the charger carries on the registry
  // read path - included so the list can show "you rated 4, average 3.8" without a second
  // round trip.
  repeated registry.v1.CategoryRating aggregate = 3;
  google.protobuf.Timestamp rated_at = 4;
}

message ListMyRatingsResponse {
  repeated MyRating ratings = 1;
  int64 total_size = 2;
  string next_page_token = 3;
}

// FavoriteService manages the caller's flat list of favorited chargers.
service FavoriteService {
  // FavoriteCharger sets whether the charger is in the caller's favorites. Idempotent -
  // favoriting an already-favorited charger is not an error.
  rpc FavoriteCharger(FavoriteChargerRequest) returns (FavoriteChargerResponse);
  rpc ListFavorites(ListFavoritesRequest) returns (ListFavoritesResponse);
}

// ProjectService manages the caller's named charger shortlists. Every RPC here requires a
// paid plan - see internal/entitlement.
service ProjectService {
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  // UpdateProject changes project attributes only. Use ManageProjectChargers to change
  // which chargers the project contains.
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  rpc DeleteProject(DeleteProjectRequest) returns (google.protobuf.Empty);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  // ManageProjectChargers applies a batch of membership changes atomically.
  rpc ManageProjectChargers(ManageProjectChargersRequest) returns (ManageProjectChargersResponse);
}

// RatingService owns the rating write path, moved here from RegistryService.
service RatingService {
  // SubmitRating upserts the caller's per-category scores for one charger and returns the
  // recomputed aggregate.
  rpc SubmitRating(SubmitRatingRequest) returns (SubmitRatingResponse);
  rpc ListMyRatings(ListMyRatingsRequest) returns (ListMyRatingsResponse);
}

// Pending actions are favorites/projects/ratings writes the chat assistant proposed on
// the caller's behalf (through the hub's MCP user tools) that only run once the caller
// confirms them here. Confirming must come through the Oathkeeper edge with the user's
// own session, so the assistant can never approve its own proposal. Actions expire after
// a short TTL; an expired action is simply not found.

enum PendingActionKind {
  PENDING_ACTION_KIND_UNSPECIFIED = 0;
  PENDING_ACTION_KIND_FAVORITE = 1;
  PENDING_ACTION_KIND_PROJECT = 2;
  PENDING_ACTION_KIND_RATING = 3;
}

enum PendingActionStatus {
  PENDING_ACTION_STATUS_UNSPECIFIED = 0;
  PENDING_ACTION_STATUS_PENDING = 1;
  PENDING_ACTION_STATUS_CONFIRMED = 2;
  PENDING_ACTION_STATUS_REJECTED = 3;
  // The action was confirmed but the write itself failed.
  PENDING_ACTION_STATUS_FAILED = 4;
}

message PendingAction {
  string id = 1;
  PendingActionKind kind = 2;
  // Human-readable description of exactly what Confirm will do, built by the hub from
  // catalogue data rather than written by the assistant.
  string summary = 3;
  PendingActionStatus status = 4;
  google.protobuf.Timestamp expires_at = 5;
  string conversation_id = 6;
  // Confirming removes something, e.g. a favorite or a charger from a project.
  bool destructive = 7;
}

message GetPendingActionRequest {
  string action_id = 1;
}

message GetPendingActionResponse {
  PendingAction action = 1;
}

message ListPendingActionsRequest {
  string conversation_id = 1;
}

message ListPendingActionsResponse {
  // The caller's unexpired actions in the conversation, oldest first. Expired actions are
  // omitted.
  repeated PendingAction actions = 1;
}

message ConfirmPendingActionRequest {
  string action_id = 1;
}

message ConfirmPendingActionResponse {
  PendingAction action = 1;
}

message RejectPendingActionRequest {
  string action_id = 1;
}

message RejectPendingActionResponse {
  PendingAction action = 1;
}

// PendingActionService lets the caller decide on actions the chat assistant proposed.
service PendingActionService {
  rpc GetPendingAction(GetPendingActionRequest) returns (GetPendingActionResponse);
  rpc ListPendingActions(ListPendingActionsRequest) returns (ListPendingActionsResponse);
  // ConfirmPendingAction runs the action. Fails with FAILED_PRECONDITION if it was already
  // decided, NOT_FOUND if it doesn't exist, isn't the caller's, or has expired.
  rpc ConfirmPendingAction(ConfirmPendingActionRequest) returns (ConfirmPendingActionResponse);
  // RejectPendingAction declines the action; nothing runs. Same errors as Confirm.
  rpc RejectPendingAction(RejectPendingActionRequest) returns (RejectPendingActionResponse);
}
