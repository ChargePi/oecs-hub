version: v2
inputs:
  - directory: proto
plugins:
  - remote: buf.build/protocolbuffers/js:v4.0.2
    out: src/lib/registry/gen
    opt:
      - import_style=commonjs
      - binary
  - remote: buf.build/grpc/web:v2.0.2
    out: src/lib/registry/gen
    opt:
      - import_style=typescript
      - mode=grpcweb
