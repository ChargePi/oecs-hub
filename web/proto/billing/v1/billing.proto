syntax = "proto3";

package billing.v1;

import "google/protobuf/timestamp.proto";

// Every RPC except GetPlans operates on the caller's own identity
// (auth.RequireIdentity) - none take an explicit customer/identity id param. Nothing
// here encodes pricing/tier logic; values are either opaque plan codes or numbers Lago
// already computed for this caller.
service BillingService {
  rpc GetUsage(GetUsageRequest) returns (GetUsageResponse);
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse);
  rpc GetPaymentPortalUrl(GetPaymentPortalUrlRequest) returns (GetPaymentPortalUrlResponse);
  // Switches to another plan of the caller's own account type. Upgrades apply
  // immediately once all invoices are paid and a payment method is on file; downgrades
  // take effect at the end of the current billing period.
  rpc ChangePlan(ChangePlanRequest) returns (ChangePlanResponse);
  // The one public/anonymous RPC on this service - called from the still-unauthenticated
  // registration wizard. See access-rules.yml's billing-service-public rule.
  rpc GetPlans(GetPlansRequest) returns (GetPlansResponse);
  // Tier and active addons without usage, cheap enough for per-request gating.
  rpc GetEntitlements(GetEntitlementsRequest) returns (GetEntitlementsResponse);
  // Gated like an upgrade, plus the addon's required tier if it has one.
  rpc SubscribeAddon(SubscribeAddonRequest) returns (SubscribeAddonResponse);
  // Ends the addon at the end of its billing period.
  rpc CancelAddon(CancelAddonRequest) returns (CancelAddonResponse);
}

enum PlanKind {
  PLAN_KIND_UNSPECIFIED = 0;
  PLAN_KIND_BASE = 1;
  PLAN_KIND_ADDON = 2;
}

enum AddonStatus {
  ADDON_STATUS_UNSPECIFIED = 0;
  ADDON_STATUS_ACTIVE = 1;
  // Still active until ends_at, then terminated.
  ADDON_STATUS_ENDING = 2;
}

enum AccountType {
  ACCOUNT_TYPE_UNSPECIFIED = 0;
  ACCOUNT_TYPE_INDIVIDUAL = 1;
  ACCOUNT_TYPE_MANUFACTURER = 2;
  ACCOUNT_TYPE_BUSINESS = 3;
}

enum PlanTier {
  PLAN_TIER_UNSPECIFIED = 0;
  PLAN_TIER_FREE = 1;
  PLAN_TIER_PAID = 2;
}

message GetPlansRequest {}

message Plan {
  // Opaque Lago plan_code, e.g. "individual_paid" - passed back verbatim as
  // transient_payload.plan_code on registration submission, never interpreted here.
  string code = 1;
  // Lago's plan.name, shown verbatim (e.g. "Individual Free").
  string display_name = 2;
  int64 amount_cents = 3;
  string currency = 4;
  // Lago's raw interval string (e.g. "monthly") - shown as-is, not enum-mapped.
  string interval = 5;
  AccountType account_type = 6;
  PlanTier tier = 7;
  // The plan's free monthly allowance, unset if it has none (e.g. a paid,
  // pay-per-use plan).
  optional double included_units = 8;
  PlanKind kind = 9;
  // Set for addon plans, e.g. "planning_agent".
  string addon_key = 10;
  // The base tier an addon plan requires.
  PlanTier requires_tier = 11;
}

message GetPlansResponse {
  repeated Plan plans = 1;
}

message GetUsageRequest {}

message UsageMetric {
  string code = 1;
  string name = 2;
  string units = 3;
  double consumed_units = 4;
  optional double included_units = 5;
}

message GetUsageResponse {
  // Lago's plan.name, e.g. "Individual Free" - shown verbatim.
  string plan_name = 1;
  repeated UsageMetric metrics = 2;
  google.protobuf.Timestamp period_start = 3;
  google.protobuf.Timestamp period_end = 4;
  PlanTier tier = 5;
  string plan_code = 6;
  // Set while a downgrade is scheduled for the end of the current period.
  optional string next_plan_code = 7;
  optional google.protobuf.Timestamp next_plan_at = 8;
  repeated AddonSubscription addons = 9;
}

message AddonSubscription {
  string addon_key = 1;
  string plan_code = 2;
  string plan_name = 3;
  AddonStatus status = 4;
  optional google.protobuf.Timestamp ends_at = 5;
  // Empty on GetEntitlements.
  repeated UsageMetric metrics = 6;
}

message GetEntitlementsRequest {}

message GetEntitlementsResponse {
  PlanTier tier = 1;
  repeated AddonSubscription addons = 2;
}

message SubscribeAddonRequest {
  string plan_code = 1;
}

message SubscribeAddonResponse {
  PlanChangeStatus status = 1;
  optional string action_url = 2;
}

message CancelAddonRequest {
  string plan_code = 1;
}

message CancelAddonResponse {
  google.protobuf.Timestamp effective_at = 1;
}

message ListInvoicesRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message Invoice {
  string id = 1;
  string number = 2;
  string status = 3;
  int64 amount_cents = 4;
  string currency = 5;
  google.protobuf.Timestamp issued_at = 6;
  optional string pdf_url = 7;
}

message ListInvoicesResponse {
  repeated Invoice invoices = 1;
  string next_page_token = 2;
  int64 total_size = 3;
}

message GetPaymentPortalUrlRequest {}

message GetPaymentPortalUrlResponse {
  string url = 1;
}

enum PlanChangeStatus {
  PLAN_CHANGE_STATUS_UNSPECIFIED = 0;
  PLAN_CHANGE_STATUS_APPLIED = 1;
  PLAN_CHANGE_STATUS_SCHEDULED = 2;
  // Nothing changed: action_url is the payment portal to settle open invoices.
  PLAN_CHANGE_STATUS_OUTSTANDING_INVOICES = 3;
  // Nothing changed: action_url is a checkout page to add a payment method.
  PLAN_CHANGE_STATUS_PAYMENT_METHOD_REQUIRED = 4;
}

message ChangePlanRequest {
  string plan_code = 1;
}

message ChangePlanResponse {
  PlanChangeStatus status = 1;
  optional string action_url = 2;
  optional google.protobuf.Timestamp effective_at = 3;
}
