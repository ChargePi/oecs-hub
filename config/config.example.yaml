# Copy to config/config.yaml for local development against
# deployments/docker/docker-compose.dev.yaml, or set the equivalent OECS_HUB_* env vars.
database:
  dsn: "postgres://oecs:oecs@localhost:5434/oecs_hub?sslmode=disable"

redis:
  address: "localhost:6379"
  password: ""
  db: 0
  cacheTtl: 1h

memgraph:
  address: "bolt://localhost:7687"
  username: ""
  password: ""

grpc:
  address: "0.0.0.0:50051"
  # Only needed for gRPC-Web requests that hit this port directly, cross-origin.
  # allowedOrigins: ["http://localhost:5173"]

adminGrpc:
  address: "0.0.0.0:50052"

# gatewaySecret must match the value Oathkeeper's header mutator injects as
# X-Gateway-Secret (deployments/docker/oathkeeper/access-rules.yml) - it's how this
# service trusts the X-User-* identity headers Traefik/Oathkeeper forward, without
# talking to Kratos itself. See internal/auth.
auth:
  gatewaySecret: "changeme-dev-only"

# Kratos admin API (port 4434, not the public 4433 the frontend talks to) - looked up
# directly for identity traits Oathkeeper doesn't forward as headers, e.g. company name.
kratos:
  adminUrl: "http://localhost:4434"

observability:
  tracing:
    enabled: false
  metrics:
    enabled: false
  logging: {}
  profiling:
    enabled: false

# Bifrost is an OpenAI-API-compatible LLM proxy deployed by the sibling
# oecs-recommendation-agent repo on this service's own docker network (oecs-hub_default) -
# reused here for prompt suggestions rather than adding a second LLM proxy.
bifrost:
  baseUrl: "http://bifrost:8080/v1"
  apiKey: ""
  model: "gemini/gemini-3.1-flash-lite"

# Configures internal/promptsuggestion.Service - the chat empty state's suggested-prompt chips.
promptSuggestions:
  # How long a topic's cached pool stays fresh before the next request regenerates it.
  refreshInterval: 30m
  # How many distinct suggestions are generated and cached per topic on each regeneration.
  poolSize: 10
  # How many of a topic's cached pool are randomly sampled and returned per request.
  returnCount: 1

# Semantic charger search: a free-text query over verified chargers is ranked by a Qdrant
# index of their specs, embedded through Bifrost. Disabled, search matches names only.
semanticSearch:
  enabled: false
  qdrantHost: "qdrant"
  qdrantPort: 6334
  collection: "oecs_chargers"
  embeddingModel: "openai/text-embedding-3-small"
  topK: 100
  minScore: 0.25
